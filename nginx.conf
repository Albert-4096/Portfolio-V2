server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json application/octet-stream;

    include /etc/nginx/snippets/security-headers.conf;

    # fonts/css/js are fingerprint-free; bump this if you start versioning
    location ~* \.(woff2|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~* \.(png|webp|json|bin)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Romanian version: same index.html, the language is picked client-side
    location = /ro { return 301 /ro/; }
    location = /ro/ { try_files /index.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
