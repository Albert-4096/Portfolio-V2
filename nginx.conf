server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml application/json application/octet-stream;

    include /etc/nginx/snippets/security-headers.conf;

    location ~* \.(woff2|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # html/css/js aren't fingerprinted: browsers keep them but check the ETag on every load, so a
    # rebuild shows up at once instead of a day-old script meeting a new page
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~* \.(png|webp|jpe?g|json|bin)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Romanian version: same index.html, the language is picked client-side
    location = /ro { return 301 /ro/; }
    location = /ro/ { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; try_files /index.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
